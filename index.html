const carriers=['全て',...new Set(Q.map(x=>x.c))],topics=['全て',...new Set(Q.map(x=>x.t))],levels=['全て','初級','中級','上級'];let sel={c:'全て',t:'全て',l:'全て'},pool=[],idx=0,answered=false;let history=JSON.parse(localStorage.getItem('cqHistory')||'{"correct":0,"total":0,"wrongIds":[]}');
function chips(id,arr,key){const el=document.getElementById(id);el.innerHTML='';arr.forEach(v=>{let b=document.createElement('button');b.className='chip'+(sel[key]===v?' active':'');b.textContent=v;b.onclick=()=>{sel[key]=v;chips(id,arr,key)};el.appendChild(b)})}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function begin(random=false){if(random){sel={c:'全て',t:'全て',l:'全て'};chips('carrierChips',carriers,'c');chips('topicChips',topics,'t');chips('levelChips',levels,'l')}pool=shuffle(Q.filter(x=>(sel.c==='全て'||x.c===sel.c||x.c==='全キャリア')&&(sel.t==='全て'||x.t===sel.t)&&(sel.l==='全て'||x.l===sel.l)));idx=0;render()}
function render(){answered=false;document.getElementById('result').style.display='none';document.getElementById('nextBtn').style.display='none';if(!pool.length){document.getElementById('quiz').style.display='none';document.getElementById('empty').style.display='block';return}document.getElementById('quiz').style.display='block';document.getElementById('empty').style.display='none';const x=pool[idx];document.getElementById('counter').textContent=`${idx+1} / ${pool.length}`;document.getElementById('bar').style.width=`${(idx/pool.length)*100}%`;document.getElementById('tags').innerHTML=`<span class="tag">${x.c}</span><span class="tag">${x.t}</span><span class="tag">${x.l}</span>`;document.getElementById('question').textContent=x.q;let order=shuffle(x.a.map((v,i)=>({v,i})));let box=document.getElementById('answers');box.innerHTML='';order.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o.v;b.onclick=()=>answer(b,o.i,x,box);box.appendChild(b)})}
function answer(btn,choice,x,box){if(answered)return;answered=true;[...box.children].forEach(b=>b.disabled=true);const good=choice===x.ok;btn.classList.add(good?'correct':'wrong');if(!good){[...box.children].find(b=>b.textContent===x.a[x.ok])?.classList.add('correct')}history.total++;if(good)history.correct++;else if(!history.wrongIds.includes(x.id))history.wrongIds.push(x.id);if(good)history.wrongIds=history.wrongIds.filter(id=>id!==x.id);localStorage.setItem('cqHistory',JSON.stringify(history));stats();let r=document.getElementById('result');r.className='result'+(good?'':' bad');r.innerHTML=`<b>${good?'正解！':'不正解'}</b><br>${x.e}<br><a class="source" href="${x.s}" target="_blank" rel="noopener">公式情報を確認 ↗</a>`;r.style.display='block';document.getElementById('nextBtn').style.display='inline-block';document.getElementById('bar').style.width=`${((idx+1)/pool.length)*100}%`}
function stats(){document.getElementById('correctStat').textContent=history.correct;document.getElementById('totalStat').textContent=history.total;document.getElementById('rateStat').textContent=history.total?Math.round(history.correct/history.total*100)+'%':'0%';document.getElementById('reviewText').textContent=history.wrongIds.length?`復習待ち：${history.wrongIds.length}問`:'復習待ちはありません'}
document.getElementById('nextBtn').onclick=()=>{idx++;if(idx>=pool.length){pool=shuffle(pool);idx=0}render()};document.getElementById('startBtn').onclick=()=>begin(false);document.getElementById('randomBtn').onclick=()=>begin(true);document.getElementById('resetBtn').onclick=()=>{history={correct:0,total:0,wrongIds:[]};localStorage.setItem('cqHistory',JSON.stringify(history));stats()};chips('carrierChips',carriers,'c');chips('topicChips',topics,'t');chips('levelChips',levels,'l');stats();begin(true);
